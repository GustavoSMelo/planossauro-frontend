server {
    listen 8080;

    add_header X-Frame-Options "SAMEORIGIN";

    gzip on;
    gzip_types text/plain text/html text/css application/javascript application/json application/x-www-form-urlencoded application/xml text/xml application/xml+rss text/javascript;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
